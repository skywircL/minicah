;border-radius:10px;padding:15px 18px}.event:before{content:'';position:absolute;left:-31px;top:22px;width:10px;height:10px;border:3px solid var(--bg);background:#7b96a8;border-radius:50%}.event.bad:before{background:var(--red)}.event.good:before{background:var(--accent)}.event.warn:before{background:#c79b4b}.event-title{display:flex;justify-content:space-between;gap:12px;margin-bottom:7px}.event-title strong{font-size:13px;overflow-wrap:anywhere}.event-title span{font-size:11px;color:var(--muted);white-space:nowrap}.event>p{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.toolresult{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}.toolresult pre{max-height:350px;overflow:auto}.file-selector{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.file-selector select{max-width:100%;padding:8px;border:1px solid var(--line);border-radius:7px;background:white}.codebox{min-width:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:white}.codebox header{padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px;display:flex;justify-content:space-between;gap:10px}.codebody{overflow:auto;max-height:520px;font:12px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace;counter-reset:line}.code-line{display:flex;min-height:22px;min-width:max-content;padding-right:12px;white-space:pre}.code-line .ln{user-select:none;min-width:40px;padding:0 10px;text-align:right;color:#81909c;border-right:1px solid #e6eaed;margin-right:10px;flex:none}.code-line.add{background:#e8f4ed}.code-line.del{background:#fcebe8}.legend{display:flex;gap:14px;margin:10px 0;font-size:12px}.legend span:before{content:'';display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:2px}.legend .add:before{background:#aed6bb}.legend .del:before{background:#e4b0aa}.context-message{padding:15px 18px;border:1px solid var(--line);border-radius:10px;background:white;margin-bottom:12px}.context-mes <body>
<header class="top">
  <div class="brand"><span class="logo">minicah<span style="color:#9cb9b2"> /</span></span><span>EVALUATION · 评测可观测</span></div>
  <div class="heading"><div><h1>失败分析工作台</h1><p class="muted">从题目要求到真实动作，逐次核对失败证据。</p></div><div class="pills"><span class="pill">deepseek-flash</span><span class="pill">Thinking 关闭</span><span class="pill">baseline-FxEhmE · 冻结报告</span></div></div>
  <div class="metrics"><div class="metric"><strong>150</strong><span>题目 · 858 次执行</span></div><div class="metric green"><strong>86.01%</strong><span>原始执行通过率</span></div><div class="metric red"><strong>120</strong><span>次失败 · 涉及 51 道题</span></div><div class="metric amber"><strong>17</strong><span>次 GT 待裁决 · 仍计失败</span></div></div>
</header>
<div class="shell">
<aside aria-label="筛选与题目列表">
  <div class="filters"><label>搜索题目 / 场景<input id="search" type="search" placeholder="例如 D19、审批、原型键" autocomplete="off"></label><div class="filterrow"><label>失败机制<select id="category"><option value="">全部机制</option></select></label><label>失败层<select id="layer"><option value="">全部层</option><option value="outcome">结果层</option><option value="behavior">行为层</option><option value="response">回复层</option></select></label></div><div class="filtercount"><span id="count" class="small muted" aria-live="polite"></span><button id="reset">重置筛选</button></div></div>
  <nav id="case-list" aria-label="题目"></nav>
</aside>
<main id="main"></main>
</div>

<script id="report-data" type="application/json">/*__REPORT_DATA__*/</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('report-data').textContent);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=x=>typeof x==='string'?x:JSON.stringify(x,null,2);
const V=x=>x===undefined?'（字段缺失）':JSON.stringify(x);
const parse=s=>{try{return JSON.parse(s)}catch{return undefined}};
const pathLink=p=>'../../'+p.split('/').map(encodeURIComponent).join('/');
const names={outcome:'结果',behavior:'行为',response:'回复'};
const views={overview:'诊断概览',timeline:'动作时间线',files:'文件对比',context:'模型上下文',evidence:'原始证据'};
const state={case:'GM-D19',rep:null,turn:null,view:'overview',file:null};
const $=s=>document.querySelector(s);
const badge=(s,cls='')=>`<span class="pill ${cls}">${E(s)}</span>`;
const code=s=>`<pre class="reply">${E(P(s))}</pre>`;
const panel=(title,body)=>`<section class="panel"><h3>${E(title)}</h3>${body}</section>`;
function resolveState(){
 let c=DATA.cases.find(c=>c.id===state.case)??DATA.cases[0]; state.case=c.id;
 let t=c.trials.find(t=>t.repetition===Number(state.rep))??c.trials.find(t=>!t.passed)??c.trials[0];state.rep=t.repetition;
 let u=t.turns.find(u=>u.number===Number(state.turn))??t.turns.find(u=>!u.passed)??t.turns.at(-1);state.turn=u.number;
 if(!views[state.view])state.view='overview';return {c,t,u};
}
function route(update){Object.assign(state,update);resolveState();const p=new URLSearchParams({case:state.case,rep:state.rep,turn:state.turn,view:state.view});if(state.view==='files'&&state.file)p.set('file',state.file);const h='#'+p.toString();if(location.hash===h)render();else location.hash=h;}
function fromHash(){const p=new URLSearchParams(location.hash.slice(1));if(p.has('case')){state.case=p.get('case');state.rep=p.get('rep');state.turn=p.get('turn');state.view=p.get('view')??'overview';state.file=p.get('file');}render();}
function filterMatch(c,t){return (!$('#category').value||t.category===$('#category').value)&&(!$('#layer').value||t.turns.some(u=>u.graders.some(g=>g.status==='failed'&&g.layer===$('#layer').value)));}
function filtered(){const q=$('#search').value.trim().toLowerCase();return DATA.cases.filter(c=>(!q||[c.id,c.title,c.rule,c.capability].join(' ').toLowerCase().includes(q))&&c.trials.some(t=>!t.passed&&filterMatch(c,t)));}
let previousListSelection=null;
function renderList(){const list=filtered();const fail=list.flatMap(c=>c.trials.filter(t=>!t.passed&&filterMatch(c,t))).length;$('#count').textContent=`${list.length} 道题 · ${fail} 次匹配失败`;
 $('#case-list').innerHTML=list.length?list.map(c=>`<button class="case ${c.id===state.case?'active':''}" data-case="${E(c.id)}" aria-current="${c.id===state.case?'true':'false'}"><span class="case-top"><span class="case-id mono">${E(c.id)}</span><span>${c.failed}/${c.total} 失败</span></span><div class="case-title">${E(c.title)}</div><div class="case-foot"><span>${E(c.categories.map(k=>DATA.categories[k]).join(' · '))}</span><span class="dots" aria-hidden="true">${c.trials.map(t=>`<i class="dot ${t.passed?'':'fail'}"></i>`).join('')}</span></div></button>`).join(''):'<div class="empty">没有匹配结果<br>尝试重置筛选。</div>';
 if(previousListSelection!==state.case){const active=$('#case-list .active');if(active){if(matchMedia('(max-width:720px)').matches)$('#case-list').scrollLeft=active.offsetLeft-12;else $('#case-list').scrollTop=active.offsetTop-$('#case-list').offsetTop-30;}previousListSelection=state.case;}
 $('#case-list').querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{const c=DATA.cases.find(c=>c.id===b.dataset.case);const t=c.trials.find(t=>!t.passed&&filterMatch(c,t));state.file=null;route({case:c.id,rep:t?.repetition??null,turn:null});});
}
function jsonRows(expected,actual,prefix=''){
 if(expected!==null&&typeof expected==='object'&&!Array.isArray(expected)&&actual!==null&&typeof actual==='object'&&!Array.isArray(actual)){
  return [...new Set([...Object.keys(expected),...Object.keys(actual)])].flatMap(k=>jsonRows(expected[k],actual[k],prefix?prefix+'.'+k:k));
 }
 return [{key:prefix||'返回值',expected:V(expected),actual:V(actual),same:V(expected)===V(actual)}];
}
function comparison(g){
 const expected=parse(g.expected),actual=parse(g.actual);
 if(['file-json-equals','text-json-equals'].includes(g.kind)&&actual!==undefined&&expected!==undefined){
  return `<div class="tablewrap"><table><thead><tr><th>字段</th><th>冻结 GT 预期</th><th>实际观察</th></tr></thead><tbody>${jsonRows(expected,actual).map(r=>`<tr><td class="mono">${E(r.key)}</td><td class="mono">${E(r.expected)}</td><td class="mono ${r.same?'':'bad'}">${E(r.actual)}${r.same?'':' ← 不一致'}</td></tr>`).join('')}</tbody></table></div>`;
 }
 return `<div class="expected-actual"><div class="value"><div class="small">冻结 GT 预期</div><pre>${E(g.expected)}</pre></div><div class="value ${g.status==='failed'?'actual':''}"><div class="small">实际观察</div><pre>${E(g.actual)}</pre></div></div>`;
}
function testCase(c){return `<div class="testcase"><div class="test-head"><strong>${E(c.id)}</strong> · ${c.status==='passed'?'通过':'失败'}</div><div class="test-input"><span class="small muted">输入参数</span>${code(c.args)}</div><div class="expected-actual"><div class="value"><div class="small">正确返回</div><pre>${E(JSON.stringify(c.expected,null,2))}</pre></div><div class="value ${c.status==='failed'?'actual':''}"><div class="small">实际返回${c.actual.known?'':' / 记录状态'}</div><pre>${E(c.actual.text)}</pre></div></div></div>`;}
function grader(g){return `<div class="criterion"><div class="criterion-title">${badge(g.status==='passed'?'通过':'失败',g.status==='passed'?'good':'bad')}${badge(names[g.layer]??g.layer)}<strong>${E(g.label)}</strong><span class="small muted mono">${E(g.id)}</span></div>${comparison(g)}${g.cases.filter(c=>c.status!=='passed').map(testCase).join('')}${g.cases.some(c=>c.status==='passed')?`<details><summary>查看 ${g.cases.filter(c=>c.status==='passed').length} 个通过的函数用例</summary>${g.cases.filter(c=>c.status==='passed').map(testCase).join('')}</details>`:''}</div>`;}
function overview(c,t,u){const failed=u.graders.filter(g=>g.status!=='passed'),passed=u.graders.filter(g=>g.status==='passed');
 return `<section class="panel callout ${u.category?.startsWith('gt-')?'warn':u.passed?'good':''}"><h3>${E(u.summary.title)}</h3><p>${E(u.summary.explanation)}</p><p class="small"><strong>正确预期 / 裁决方向：</strong>${E(u.summary.expected)}</p></section>
 <div class="grid2"><section class="panel"><div class="label-row"><h3>本轮用户要求</h3><span class="small muted">第 ${u.number} 轮原文</span></div><div class="prompt preview">${E(u.prompt)}</div><details><summary>完整题面与公开业务规则</summary><div class="prompt">${E(u.prompt)}</div><p style="margin-top:12px" class="small muted">${E(c.rule)}</p></details></section><section class="panel"><h3>Agent 实际执行</h3><div class="numbers"><div><strong>${u.modelCalls}</strong><span>模型调用</span></div><div><strong>${u.toolCalls}</strong><span>工具请求</span></div><div><strong>${u.successfulWrites}</strong><span>成功写入</span></div><div><strong>${u.denied}</strong><span>Host 拒绝</span></div></div><div class="small muted">最终回复 · 不是完成事实的证明</div>${code(u.finalText)}</section></div>
 <section class="panel"><div class="label-row"><h3>${failed.length?'失败判据：预期与实际':'本轮判据'}</h3><span class="small muted">${failed.length} 失败 / ${passed.length} 通过</span></div>${failed.map(grader).join('')}${passed.length?`<details ${failed.length?'':'open'}><summary>查看 ${passed.length} 个通过判据</summary>${passed.map(grader).join('')}</details>`:''}</section>
 <div class="control-row"><button data-go="timeline" style="padding:9px 14px">查看 Agent 操作过程 →</button><button data-go="files" style="padding:9px 14px">对照实际文件 →</button></div>`;
}
function inputHTML(input,name=''){
 if(input===null||typeof input!=='object'||Array.isArray(input))return code(input);
 const labels={path:'路径',content:'待写入内容',oldText:'待替换文本',newText:'替换为',expectedHash:'读取时的文件 hash',query:'搜索词',startLine:'起始行',endLine:'结束行',maxMatches:'最多命中',regex:'正则搜索'};
 return Object.entries(input).map(([k,v])=>`<div style="margin-top:10px"><div class="small muted">${E(labels[k]??k)} <span class="mono">${E(k)}</span>${name==='write_file'&&k==='oldText'?' · <strong style="color:var(--red)">write_file 不接受此字段</strong>':''}</div>${['content','oldText','newText'].includes(k)?code(v):`<div class="prompt mono small">${E(P(v))}</div>`}</div>`).join('');
}
function resultHTML(v){
 if(v===undefined)return '';
 if(v?.text!==undefined)return `<div class="toolresult"><span class="small muted">实际读取 · ${E(v.path)} · 起始行 ${E(v.startLine)}${v.truncated?' · 已截断':' · 未截断'}</span>${codebox('返回的文件内容',v.text.split('\n').map((text,i)=>({text,num:(v.startLine??1)+i,kind:''})))}</div>`;
 if(v?.matches)return `<div class="toolresult"><span class="small muted">搜索结果${v.truncated?' · 已截断':' · 未截断'}</span><div class="tablewrap"><table><thead><tr><th>文件 / 行</th><th>命中内容</th></tr></thead><tbody>${v.matches.map(m=>`<tr><td>${E(m.path)}:${E(m.line)}</td><td class="mono">${E(m.text)}</td></tr>`).join('')}</tbody></table></div></div>`;
 if(v?.paths)return `<p class="small muted" style="margin-top:8px">${v.paths.map(E).join(' · ')}</p>`;
 if(v?.ok===true)return `<p class="small muted" style="margin-top:8px">${E(v.path)} · ${E(v.bytes??'—')} bytes · 已提交</p>`;
 return `<details><summary>工具返回详情</summary>${code(v)}</details>`;
}
function timelineView(u){return `<div class="control-row"><label><input id="only-actions" type="checkbox">仅显示工具与审批事件</label><span class="small muted">事件按 seq 排序；模型文字不等于工具执行。</span></div><p id="timeline-empty" class="empty" hidden>本轮没有工具或审批事件。</p><div class="timeline">${u.steps.map(s=>`<article class="event ${s.tone}" data-kind="${s.kind}"><div class="event-title"><strong>${E(s.title)}</strong><span>seq ${s.seq} · ${E(s.timestamp.slice(11,23))} UTC</span></div><p>${E(s.text||'（无文字回复）')}</p>${s.calls?.length?`<details><summary>查看请求的工具与参数（${s.calls.length}）</summary>${s.calls.map(c=>`<h4>${E(c.name)}</h4>${inputHTML(parse(c.arguments)??c.arguments,c.name)}`).join('')}</details>`:''}${s.input!==undefined?`<details ${s.kind==='rejected'?'open':''}><summary>调用参数</summary>${inputHTML(s.input,s.name)}</details>`:''}${resultHTML(s.result)}</article>`).join('')||'<div class="empty">本轮没有保存模型或工具事件。</div>'}</div>`;}
function diffLines(a,b){
 const aa=(a??'').split('\n'),bb=(b??'').split('\n');
 if(aa.length*bb.length>250000)return {a:aa.map((s,i)=>({text:s,num:i+1,kind:a===b?'':'del'})),b:bb.map((s,i)=>({text:s,num:i+1,kind:a===b?'':'add'})),coarse:true};
 const dp=Array.from({length:aa.length+1},()=>new Uint32Array(bb.length+1));
 for(let i=aa.length-1;i>=0;i--)for(let j=bb.length-1;j>=0;j--)dp[i][j]=aa[i]===bb[j]?1+dp[i+1][j+1]:Math.max(dp[i+1][j],dp[i][j+1]);
 const x=[],y=[];let i=0,j=0;
 while(i<aa.length||j<bb.length){if(i<aa.length&&j<bb.length&&aa[i]===bb[j]){x.push({text:aa[i],num:++i,kind:''});y.push({text:bb[j],num:++j,kind:''});}else if(j<bb.length&&(i===aa.length||dp[i][j+1]>=dp[i+1][j]))y.push({text:bb[j],num:++j,kind:'add'});else x.push({text:aa[i],num:++i,kind:'del'});}
 return {a:x,b:y};
}
function codebox(title,lines){return `<div class="codebox"><header><strong>${E(title)}</strong><span class="muted">行号</span></header><div class="codebody">${lines.map(l=>`<div class="code-line ${l.kind}"><span class="ln">${l.num}</span><span>${E(l.text)||' '}</span></div>`).join('')}</div></div>`;}
function filesView(u){const paths=[...new Set([...Object.keys(u.before),...Object.keys(u.after)])];if(!paths.includes(state.file))state.file=paths.find(p=>u.graders.some(g=>g.path===p&&g.status==='failed'))??paths.find(p=>u.before[p]!==u.after[p])??paths[0];const p=state.file;if(!p)return '<div class="empty">没有文件快照。</div>';const d=diffLines(u.before[p],u.after[p]);const expected=u.graders.find(g=>g.kind==='file-json-equals'&&g.path===p);
 return `<div class="file-selector"><select id="file-select" aria-label="选择文件">${paths.map(p=>`<option ${p===state.file?'selected':''} value="${E(p)}">${E(p)} · ${u.before[p]===u.after[p]?'未变化':'已变化'}</option>`).join('')}</select>${badge(u.before[p]===u.after[p]?'本轮没有修改此文件':'本轮文件发生变化',u.before[p]===u.after[p]?'':'good')}</div><p class="small muted">${E(u.stateSource)}</p><div class="legend"><span class="del">修改前删除的行</span><span class="add">修改后新增的行</span></div>${d.coarse?'<p class="small muted">文件较大，显示全文变化标记。</p>':''}<div class="grid2">${codebox('本轮开始',d.a)}${codebox('本轮结束 · 实际',d.b)}</div>${expected?`<section class="panel" style="margin-top:18px"><h3>最终状态要求</h3>${comparison(expected)}</section>`:''}${u.reference[p]?`<section class="panel" style="margin-top:18px"><details><summary>查看参考实现（一个可行解，非唯一正确答案）</summary>${code(u.reference[p])}</details></section>`:''}`;
}
function contextView(u){return `<section class="panel"><h3>模型真正收到的上下文</h3><p>以下为本轮首次模型请求中的完整消息序列。后续模型回复和工具返回见动作时间线。这里展示输入与外显行为，不推断模型内部思考。</p><p class="small muted" style="margin-top:10px">模型 ${E(u.modelConfig.model)} · Thinking ${E(P(u.modelConfig.thinking))} · 最大输出 ${u.modelConfig.maxTokens} tokens<br>可用工具：${u.modelConfig.tools.map(E).join('、')}</p></section>${u.context.map((m,i)=>`<article class="context-message ${E(m.role)}"><div class="role">${i+1} / ${E(m.role)}${m.tool_call_id?' · 工具返回':''}</div><div class="prompt">${E(typeof m.content==='string'?m.content:P(m.content))}</div>${m.tool_calls?.length?`<details><summary>工具调用参数</summary>${m.tool_calls.map(c=>`<h4>${E(c.function.name)}</h4>${code(parse(c.function.arguments)??c.function.arguments)}`).join('')}</details>`:''}</article>`).join('')}`;}
function evidenceView(c,t,u){return panel('可追溯的原始证据',`<p>当前视图由冻结报告生成，原始判定和分母保持不变。已核对 ${DATA.meta.verifiedFiles} 份证据文件 hash，以及这 51 道题的定义版本。</p><div class="evidence"><a href="cases/${E(c.id)}.md">可读题目页</a><a href="trials/${E(c.id)}-r${t.repetition}.md">可读执行页 · 第 ${t.repetition} 次</a><a href="${pathLink(c.seedPath)}">原始题目 JSON</a><a href="${pathLink(t.sourceReport)}">原始评分报告 JSON</a><a href="${pathLink(t.journal)}">原始事件轨迹 JSONL</a></div><p class="hash">报告 SHA-256：${E(t.reportHash)}<br>轨迹 SHA-256：${E(t.journalHash)}<br>本轮 runId：${E(u.runId)}</p><details><summary>当前轮次的结构化派生数据</summary>${code(u)}</details>`);}
function render(){const {c,t,u}=resolveState();renderList();
 $('#main').innerHTML=`<div class="case-heading"><div><div class="pills">${badge(c.id)}${badge(c.capability)}${badge(c.kind==='conversation'?'多轮任务':'单轮任务')}${badge(t.passed?'原始判定：通过':'原始判定：失败',t.passed?'good':'bad')}${t.category?.startsWith('gt-')?badge('GT 待裁决 · 未改分','warn'):''}</div><h2>${E(c.title)}</h2><p class="small muted" style="margin-top:7px">本题 ${c.failed} / ${c.total} 次失败 · ${E(DATA.categories[t.category]??'全部判据通过')} · 本次耗时 ${(t.durationMs/1000).toFixed(2)}s</p></div><div><button id="copy-link">复制当前链接</button><div id="notice" aria-live="polite"></div></div></div>
 <section class="reps"><div class="reps-head"><strong class="small">切换重复执行</strong><span class="small muted">同一题独立重置；通过项可作为对照</span></div><div class="rep-buttons">${c.trials.map(r=>`<button class="rep ${r.passed?'pass':'fail'}" data-rep="${r.repetition}" aria-pressed="${r.repetition===t.repetition}">第 ${r.repetition} 次 <em>${r.passed?'✓ 通过':'× 失败'}</em></button>`).join('')}</div></section>
 ${t.turns.length>1?`<div class="turns" aria-label="对话轮次">${t.turns.map(x=>`<button class="turn" data-turn="${x.number}" aria-pressed="${u.number===x.number}">第 ${x.number} 轮 · ${x.passed?'通过':'失败'}</button>`).join('')}</div>`:''}
 <nav class="navtabs" aria-label="分析视图">${Object.entries(views).map(([id,label])=>`<button data-view="${id}" aria-pressed="${state.view===id}">${label}</button>`).join('')}</nav>
 <div id="content">${({overview:()=>overview(c,t,u),timeline:()=>timelineView(u),files:()=>filesView(u),context:()=>contextView(u),evidence:()=>evidenceView(c,t,u)})[state.view]()}</div>
 <footer>本页覆盖 51 道失败题的 ${DATA.meta.loadedTrials} 次执行（包含通过对照）。分类按失败试验去重，结果/行为/回复层可重叠。GT 待裁决不等于已确认误判。<br>离线派生视图 · <a href="README.md">可读目录与生成说明</a> · <a href="../evaluation-expansion-badcases.md">完整分析文档</a></footer>`;
 $('#main').querySelectorAll('[data-rep]').forEach(b=>b.onclick=()=>{state.file=null;route({rep:Number(b.dataset.rep),turn:null})});
 $('#main').querySelectorAll('[data-turn]').forEach(b=>b.onclick=()=>{state.file=null;route({turn:Number(b.dataset.turn)})});
 $('#main').querySelectorAll('[data-view],[data-go]').forEach(b=>b.onclick=()=>route({view:b.dataset.view??b.dataset.go}));
 $('#copy-link').onclick=async()=>{try{const p=new URLSearchParams({case:c.id,rep:t.repetition,turn:u.number,view:state.view});if(state.view==='files'&&state.file)p.set('file',state.file);await navigator.clipboard.writeText(location.href.split('#')[0]+'#'+p);$('#notice').textContent='链接已复制';}catch{$('#notice').textContent='请复制浏览器地址栏链接';}};
 if($('#file-select'))$('#file-select').onchange=e=>{route({file:e.target.value})};
 if($('#only-actions'))$('#only-actions').onchange=e=>{$('.timeline').querySelectorAll('[data-kind=model]').forEach(x=>x.hidden=e.target.checked);$('#timeline-empty').hidden=!(e.target.checked&&u.steps.every(s=>s.kind==='model'))};
}
function onFilter(){
 const list=filtered();
 if(!list.length){renderList();$('#main').innerHTML='<div class="empty"><h2>没有匹配的失败执行</h2><p>修改搜索词或点击左侧“重置筛选”。</p></div>';return;}
 const c=list.find(c=>c.id===state.case)??list[0];
 const t=c.trials.find(t=>t.repetition===state.rep&&!t.passed&&filterMatch(c,t))??c.trials.find(t=>!t.passed&&filterMatch(c,t));
 const turn=t.turns.find(u=>u.graders.some(g=>g.status==='failed'&&(!$('#layer').value||g.layer===$('#layer').value)));
 route({case:c.id,rep:t.repetition,turn:turn?.number??null});
}
for(const [id,name]of Object.entries(DATA.categories))$('#category').insertAdjacentHTML('beforeend',`<option value="${E(id)}">${E(name)} · ${DATA.meta.counts[id]}</option>`);
$('#search').oninput=onFilter;$('#category').onchange=onFilter;$('#layer').onchange=onFilter;
$('#reset').onclick=()=>{$('#search').value='';$('#category').value='';$('#layer').value='';previousListSelection=null;render()};
window.addEventListener('hashchange',fromHash);fromHash();
</script>
</body>
</html>
